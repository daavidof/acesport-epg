name: Update EPG

on:
  schedule:
    - cron: "0 */6 * * *"   # elke 6 uur
  workflow_dispatch:

# Zorgt dat er nooit twee runs tegelijk draaien
concurrency:
  group: epg-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # volledige history, nodig voor rebase
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Filter EPG
        run: python filter_epg.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add epg.xml epg.xml.gz

          # Stop netjes als er niets gewijzigd is
          if git diff --staged --quiet; then
            echo "Geen wijzigingen, niets te committen."
            exit 0
          fi

          git commit -m "Update EPG $(date -u +%Y-%m-%dT%H:%MZ)"

          # Remote changes ophalen en onze commit erbovenop zetten
          git pull --rebase origin main

          git push
